[package]
name = "flowarc-core"
version = "0.1.0"
edition = "2021"
description = "FlowArc / AUP 2.0 核心：状态机、规则引擎、本地存储（无 UI 依赖，可独立测试）"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
